<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a120a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1a120a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a120a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="The Dawn-Breakers" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>The Dawn-Breakers</title>
    <meta name="description" content="A quiet, story-led browser RPG drawn from Nabíl's narrative: walk Shíráz on the eve of 23 May 1844 and follow the Dawn-Breakers across Persia." />
    <!-- Link previews (iMessage, Slack, social sites) need absolute URLs; regenerate the image with `npm run social-preview`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Dawn-Breakers" />
    <meta property="og:title" content="The Dawn-Breakers" />
    <meta property="og:description" content="A quiet, story-led browser RPG drawn from Nabíl's narrative: walk Shíráz on the eve of 23 May 1844 and follow the Dawn-Breakers across Persia." />
    <meta property="og:url" content="https://theontho.github.io/dawnbreakers/" />
    <meta property="og:image" content="https://theontho.github.io/dawnbreakers/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The sun rising over the walls and blue dome of Shíráz beneath the title The Dawn-Breakers." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        color-scheme: dark;
        --game-viewport-height: 100vh;
        --game-extra-safe-area-top: 0px;
        --game-extra-safe-area-bottom: 0px;
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
        background-color: #0a0806;
        background: linear-gradient(180deg, #1a120a 0%, #0a0806 55%, #050403 100%);
      }
      html, body { margin: 0; padding: 0; width: 100%; min-width: 100%; height: var(--game-viewport-height); min-height: var(--game-viewport-height); background-color: #0a0806; background: linear-gradient(180deg, #1a120a 0%, #0a0806 55%, #050403 100%); color: #e8d9b0;
        font-family: 'Georgia', 'Times New Roman', serif; overflow: hidden; overscroll-behavior: none; touch-action: none; }
      body::before {
        content: "";
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        height: var(--game-viewport-height);
        z-index: -1;
        background: linear-gradient(180deg, #1a120a 0%, #0a0806 55%, #050403 100%);
      }
      #game {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        width: 100vw;
        height: var(--game-viewport-height);
        min-width: 320px;
        min-height: 480px;
        background-color: #0a0806;
        overflow: hidden;
      }
      #game canvas { display: block; width: 100%; height: 100%; }
      /* Shown with the page itself, before any script, until the title is drawn. */
      #splash {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 10px; text-align: center; pointer-events: none;
        background: linear-gradient(180deg, #030716 0%, #071329 40%, #1a1831 72%, #0a090c 100%);
        transition: opacity 0.6s ease;
      }
      #splash.gone { opacity: 0; }
      #splash h1 { margin: 0 16px; font-weight: normal; font-size: clamp(34px, 8vw, 68px); color: #f3e2b5; text-shadow: 0 2px 10px #120b05; }
      #splash p { margin: 0 16px; font-style: italic; color: #e2c98f; font-size: clamp(15px, 2.4vw, 22px); }
      #splash .loading { margin-top: 18px; font-size: 14px; color: #9c8458; animation: breathe 1.8s ease-in-out infinite; }
      #splash .bar {
        width: min(260px, 64vw); height: 3px; border-radius: 2px; overflow: hidden; background: rgba(226, 201, 143, 0.16);
      }
      #splash .bar i {
        display: block; height: 100%; background: linear-gradient(90deg, #9c7a3c, #f3e2b5); transform-origin: left;
        transform: scaleX(0.02); transition: transform 0.35s ease-out;
      }
      #splash[dir="rtl"] .bar i { transform-origin: right; }
      #splash .stars { position: absolute; inset: 0; z-index: -1; }
      #splash .stars i {
        position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff3c8;
        animation: twinkle 3s ease-in-out infinite;
      }
      @keyframes breathe { 50% { opacity: 0.35; } }
      @keyframes twinkle { 50% { opacity: 0.25; } }
      #splash[dir="rtl"] h1, #splash[dir="rtl"] p { font-family: Tahoma, Arial, "Noto Naskh Arabic", sans-serif; }
      #splash[lang="zh"] h1, #splash[lang="zh"] p { font-family: Arial, "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body bgcolor="#0a0806">
    <div id="game"></div>
    <div id="splash" aria-live="polite">
      <div class="stars"></div>
      <h1>The Dawn-Breakers</h1>
      <p>Shíráz, the eve of 23 May 1844</p>
      <div class="loading">Loading…</div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="2"><i></i></div>
    </div>
    <script>
      // The first screen, before the game's scripts arrive: in the player's language, under a few stars.
      (function () {
        var splash = document.getElementById('splash');
        var words = {
          fa: ['مطالع‌الانوار', 'شیراز، شب ۲۳ مه ۱۸۴۴', 'در حال بارگذاری…'],
          zh: ['破晓者', '设拉子，1844年5月22日夜', '正在加载…'],
        };
        var locale;
        try { locale = localStorage.getItem('dawnbreakers.locale'); } catch (e) { locale = null; }
        var text = locale && words[locale];
        if (text) {
          splash.setAttribute('lang', locale);
          if (locale === 'fa') splash.setAttribute('dir', 'rtl');
          splash.querySelector('h1').textContent = text[0];
          splash.querySelector('p').textContent = text[1];
          splash.querySelector('.loading').textContent = text[2];
        }
        // The loading bar only ever moves forward; the loader and the game both report to it.
        var bar = splash.querySelector('.bar');
        var fill = bar.querySelector('i');
        var shown = 0.02;
        window.splashProgress = function (fraction) {
          if (!(fraction > shown)) return;
          shown = Math.min(1, fraction);
          fill.style.transform = 'scaleX(' + shown + ')';
          bar.setAttribute('aria-valuenow', String(Math.round(shown * 100)));
        };
        var stars = splash.querySelector('.stars');
        for (var i = 0; i < 90; i++) {
          var star = document.createElement('i');
          star.style.left = (Math.random() * 100) + '%';
          star.style.top = (Math.random() * 68) + '%';
          star.style.opacity = String(0.3 + Math.random() * 0.7);
          star.style.animationDelay = (Math.random() * 3) + 's';
          stars.appendChild(star);
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
